name: shellcheck

on:
  workflow_dispatch:
  push:
    paths: ["**.sh", "tests/**", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", "tests/**", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # bash -n catches the failure that actually matters here: a syntax error
      # that would strand someone half-way through a 30-minute install.
      - name: Syntax check
        run: |
          for f in *.sh; do
            echo "== $f"
            bash -n "$f"
          done

      # shellcheck runs at warning severity. These scripts intentionally
      # avoid `set -e`/`set -u` (see the header comment in termux-linux-setup.sh),
      # which trips a lot of shellcheck's style and info-level advice.
      - name: shellcheck
        run: shellcheck --severity=warning --shell=bash *.sh

      # Generate and exercise launchers with mocked Android commands. This catches
      # heredoc command substitution and runtime bugs that bash -n cannot detect.
      - name: Installer regressions
        run: python3 tests/test_installers.py
